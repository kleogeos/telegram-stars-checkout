name: Telegram Stars checkout responder

# Public-repo Actions minutes are unlimited, so this gives near-continuous
# coverage for $0: each run long-polls for ~5h50m (under the 6h job cap),
# and cron re-triggers the next run right after, leaving only a few seconds
# of gap. Needs a DEDICATED bot token (TELEGRAM_BOT_TOKEN secret) — never
# the Midas human-notification bot, since two consumers polling the same
# bot's getUpdates would steal each other's updates.
#
# The `schedule` trigger is intentionally commented out until the secret
# exists: cron would otherwise fire every 6h forever and fail every time
# (no token yet), leaving this public repo with a permanently red Actions
# tab. Uncomment it as the last step of activation, after TELEGRAM_BOT_TOKEN
# is set.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

concurrency:
  group: telegram-stars-bot
  cancel-in-progress: false

# The responder commits encrypted customer state after each polling window.
# GitHub's default GITHUB_TOKEN permission may be read-only, which lets the
# responder serve updates but makes its final git push fail (exit 128).
permissions:
  contents: write

jobs:
  respond:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      # A scheduled run can wait behind the previous long-poll job for hours.
      # Its event SHA is then stale because that job committed new state.
      # Check out the current main when this job actually starts.
      - uses: actions/checkout@v4
        with:
          ref: main

      # The repository is public. Keep invoice details and subscriber payment
      # identifiers encrypted at rest, using the bot token already in Secrets.
      - name: Restore encrypted customer state
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail
          for file in fulfilled.json pending_orders.json subscribers.json; do
            if [[ -f "$file.enc" ]]; then
              openssl enc -d -aes-256-cbc -pbkdf2 -iter 100000 \
                -pass env:TELEGRAM_BOT_TOKEN -in "$file.enc" -out "$file"
            fi
          done

      - name: Run responder
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_NOTIFY_TOKEN: ${{ secrets.TELEGRAM_NOTIFY_TOKEN }}
          TELEGRAM_NOTIFY_CHAT_ID: ${{ secrets.TELEGRAM_NOTIFY_CHAT_ID }}
        run: python3 bot.py

      - name: Persist encrypted customer state
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail
          for file in fulfilled.json pending_orders.json subscribers.json; do
            if [[ ! -f "$file" && ! -f "$file.enc" ]]; then
              printf '{}\n' > "$file"
            fi
            if [[ -f "$file" ]]; then
              openssl enc -e -aes-256-cbc -pbkdf2 -iter 100000 -salt \
                -pass env:TELEGRAM_BOT_TOKEN -in "$file" -out "$file.enc"
              rm "$file"
            fi
          done

      - name: Commit updated state
        if: always()
        run: |
          git config user.name "telegram-stars-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json fulfilled.json.enc pending_orders.json.enc subscribers.json.enc
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Update bot state [skip ci]"
          # A plain git push used to fail silently with 'fetch first' whenever
          # main moved during this job's ~5h50m long-poll (e.g. a direct code
          # push elsewhere in the same window) - the commit step would fail
          # but the job itself reported no error visible without checking
          # Actions, and the whole run's offset/fulfilled-dedup advance was
          # discarded, risking a re-processed update and a duplicate "Sale!"
          # notify + duplicate download message on the next run. Retry with
          # rebase onto the latest main instead of giving up after one push.
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt $i), rebasing onto latest origin/main"
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort
              echo "::error::rebase conflict on state.json/fulfilled.json, giving up"
              exit 1
            fi
            sleep 3
          done
          echo "::error::failed to push bot state after 5 attempts"
          exit 1
