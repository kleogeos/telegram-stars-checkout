name: Test

on:
  push:
  pull_request:

jobs:
  test:
    # Python 3.9 is not available to setup-python on Ubuntu 26.04, which
    # ubuntu-latest moved to in November 2026. Keep this matrix on 24.04.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python3 -m unittest test_bot.py -v
